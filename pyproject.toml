[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "maintainer-radar"
version = "0.1.0"
description = "A local-first triage, PR risk, and release-readiness CLI for open-source maintainers."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Maintainer Radar contributors" }
]
keywords = [
  "open-source",
  "maintainers",
  "triage",
  "pull-requests",
  "release-management",
  "codex"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Bug Tracking",
  "Topic :: Software Development :: Quality Assurance"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Lyin01/maintainer-radar"
Issues = "https://github.com/Lyin01/maintainer-radar/issues"
Documentation = "https://github.com/Lyin01/maintainer-radar/tree/main/docs"

[project.scripts]
maintainer-radar = "maintainer_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
