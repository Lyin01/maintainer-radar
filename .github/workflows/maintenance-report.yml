name: Maintenance Report

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Generate maintainer reports
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m maintainer_radar snapshot-github "$GITHUB_REPOSITORY" --output reports/github-snapshot.json
          python -m maintainer_radar analyze reports/github-snapshot.json --output reports/triage.md
          python -m maintainer_radar brief reports/github-snapshot.json --output reports/codex-brief.md
          python -m maintainer_radar apply-pack reports/github-snapshot.json --repository-url "https://github.com/$GITHUB_REPOSITORY" --output reports/application-pack.md
          python -m maintainer_radar gate reports/github-snapshot.json --warn-only --output reports/gate.md
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: maintainer-radar-report
          path: reports/
