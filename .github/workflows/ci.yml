name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Smoke test CLI
        run: |
          python -m maintainer_radar analyze examples/github-snapshot.json --output reports/triage.md
          python -m maintainer_radar brief examples/github-snapshot.json --output reports/codex-brief.md
          python -m maintainer_radar apply-pack examples/github-snapshot.json --repository-url https://github.com/example/critical-oss-project --output reports/application-pack.md
          python -m maintainer_radar gate examples/github-snapshot.json --warn-only --output reports/gate.md
